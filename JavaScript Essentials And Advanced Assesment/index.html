<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="text-center mb-4">Guest Registration</h3>

      <form id="customerForm" class="row g-3" novalidate>

        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" required>
          <div class="invalid-feedback">Minimum 3 characters required</div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone" required>
          <div class="invalid-feedback">Enter valid 10-digit number</div>
        </div>

        <div class="col-md-6">
          <label>Email</label>
          <input type="email" class="form-control" id="email" required>
          <div class="invalid-feedback">Enter valid email</div>
        </div>

        <div class="col-md-6">
          <label>Aadhar</label>
          <input type="text" class="form-control" id="aadhar" required>
          <div class="invalid-feedback">Enter valid 12-digit Aadhar</div>
        </div>

        <div class="col-12">
          <label>Address</label>
          <textarea class="form-control" id="address" required></textarea>
        </div>

        <div class="col-md-6">
          <label>Check In</label>
          <input type="date" class="form-control" id="checkin" required>
        </div>

        <div class="col-md-6">
          <label>Check Out</label>
          <input type="date" class="form-control" id="checkout" required>
        </div>

        <div class="col-md-6">
          <label>No of Adults</label>
          <input type="number" class="form-control" id="adults" min="1" required>
        </div>

        <div class="col-12">
          <label>Purpose</label>
          <textarea class="form-control" id="purpose" required></textarea>
        </div>

        <div class="col-12 text-center">
          <button class="btn btn-primary px-5">Submit</button>
          <a href="view.html" class="btn btn-outline-secondary ms-2">View Data</a>
        </div>

      </form>

      <div id="messageBox" class="mt-3"></div>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
