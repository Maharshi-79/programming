<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>setTimeout Example</title>
</head>
<body>

    <h2>Background Color Change Example</h2>

    <script>
        // Change background color after 5 seconds
        setTimeout(function () {
            document.body.style.backgroundColor = "lightblue";
        }, 5000);
    </script>

</body>
</html>
