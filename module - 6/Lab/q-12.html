<body>
    <h2>Task 2: Sum of Numbers in an Array</h2>

<script>
    let numbers = [5, 10, 15, 20, 25];

    let sum = 0;
    for (let i = 0; i < numbers.length; i++) {
        sum += numbers[i];
    }

    console.log("Sum of all numbers:", sum);
</script>
