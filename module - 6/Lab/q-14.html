<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        #clock {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock"></div>

    <script>
        function showTime() {
            const now = new Date(); 
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

        

            document.getElementById("clock").innerHTML = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(showTime, 1000);

        showTime();//call becoz we have to wait for one second
    </script>
</body>
</html>
