<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Task 3: User Input Until Number > 10</h2>

<script>
    let userInput;

    do {
        userInput = parseInt(prompt("Enter a number greater than 10:"));
    } while (userInput <= 10);

    alert("You entered: " + userInput + " (greater than 10)");
</script>

</body>
</html>
