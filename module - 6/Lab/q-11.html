<body>

<h2>Task 1: Array Operations</h2>

<script>
    let fruits = ["apple", "banana", "cherry"];
    console.log("Original array:", fruits);

    fruits.push("mango");
    console.log("After adding a fruit to the end:", fruits);

    fruits.shift();
    console.log("After removing the first fruit:", fruits);
</script>
