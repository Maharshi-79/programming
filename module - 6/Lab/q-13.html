<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Object Task</title>
</head>
<body>

<h2>Car Object Example</h2>

<script>
    let car = {
        brand: "Toyota",
        model: "Corolla",
        year: 2020
    };

    console.log("Car Brand:", car.brand);
    console.log("Car Model:", car.model);

    car.year = 2024;
    console.log("Updated Year:", car.year);

    car.color = "Red";
    console.log("Car with New Property:", car);
</script>

</body>
</html>
