<body>
    <h2>Task 2: Sum of Even Numbers 1 to 20</h2>

<script>
    let sum = 0;
    let num = 2; 

    while (num <= 20) {
        sum += num;
        num += 2; 
    }

    console.log("Sum of even numbers from 1 to 20:", sum);
</script>
