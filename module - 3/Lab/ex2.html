<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            /* border: 2px solid black; */
            font-family:Arial, Helvetica, sans-serif;
            height: auto;
        }
        .main {
            background-color: #fff;
            border-radius: 15px;
            border: 2px solid black;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 400px;
        }
        .main h1{
            color:rgba(236, 83, 83, 0.826);
        }
        label{
            display: block;
            margin-bottom:5px;
            color: rgba(2, 19, 19, 0.824);
            font-weight: bold;
        }
        small{
            display:block;
            margin-bottom: 5px;
            margin-left: 10px;
            text-align: right;
            color: rgba(25, 31, 31, 0.486);
            font-weight: bold;
        }
        input[type="text"],input[type="email"],input[type="tel"],
        textarea{
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid black;
            border-radius: 5px;
        }
        button[type="submit"] {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #4db351;
            color: white;
            width: 100%;
            font-size: 19px;
        }
        button:hover{
            background-color: #45a049;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>Contact form</form></h1>
        <form action="" method="post" >

	
	<label for="name">Full Name:</label>
    <input type="text" id="name"  required><br><br>
	
	<label for="email">Enter your email:</label>
    <input type="email" id="email" placeholder="example@gmail" required><br><br>

	<label for="phone">Phone Number:</label><small>Pattern[1-9] total 10</small>
    <input type="tel" id="phone" name="phone" pattern="[1-9][0-9]{9}" maxlength="10"><br><br>
	
    <label for="Message">Enquiry Message:</label><br>
    <textarea id="Message"  rows="4" cols="35"></textarea><br><br>
	
	
    <button type="submit" >Submit</button>
    </form>

	
    </div>
</body>
</html>
