<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            grid-template-columns: 1fr;
            grid-template-rows:auto auto auto;
            grid-template-areas:
                "navbar"
                "content"
                "footer";
            gap: 10px;
            line-height: 1.6;
            text-align: center;
            text-transform: uppercase;
            min-height: 90vh;
            padding: 10px;
        }
        .navbar{
            grid-area: navbar;
            background: #a7ffeb;
            padding: 15px;
             display: flex;
            align-items: center;
            justify-content: center; 
            font-size: 16px;
            font-weight: bold;
        }
        .content{
            grid-area: content;
            display: grid;
            grid-template-columns: 1fr;
            gap:15px;
             
            padding: 15px;
            font-family:'Times New Roman', Times, serif
        }
        .column{
            background: #84ffff;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight:800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .footer {
            grid-area: footer;
            background: #1de9b6;
            /* text-align: center; */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
      }
      @media only screen and (min-width:768px) {
        .container{
            gap:20px;
        }
        .navbar{
            font-size: 24px;
            padding: 20px;
        }
        .content{
            gap:20px;
            grid-template-columns: 1fr 1fr;
            padding: 20px;
        }
        .column{
            font-size:24px;
            padding: 20px;
        }
        .footer{
            font-size: 24px;
            padding: 20px;
        }
      }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">Navigation Bar</div>
        <div class="content">
            <div class="column">Column1</div>
            <div class="column">Column2</div>
        </div>
        <div class="footer">Footer</div>

    </div>
</body>
</html>
