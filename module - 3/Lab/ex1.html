<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        color: aliceblue;
      }
      header {
        height: 100px;
        background-color: chocolate;
        border: 2px solid whitesmoke;
        border-radius: 10px;
        text-align: center;
        font-size: larger;
      }
      .main {
        height: 500px;
        border: 2px solid whitesmoke;
        margin-top: 5px;
        display: flex;
        
        align-items: center;
        
        text-align: center;
        border-radius: 10px;
        font-size: larger;
      }
      .main_div {
        background-color: chartreuse;
        height: 500px;
        width: 70%;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .main_aside {
        background-color:brown;
        margin-left: 5px;
        height: 500px;
        width: 30%;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    footer {
        height: 99px;
        background-color: chocolate;
        border: 2px solid whitesmoke;
        border-radius: 10px;
        text-align: center;
        font-size: larger;
      }
      
    </style>
  </head>
  <body>
    <header>
      <h1>Header</h1>
    </header>
    <div class="main">
      <div class="main_div">
        <main><h1>Main</h1> </main>

      </div>
      <div class="main_aside">
        <aside><h1>aside</h1></aside>
      </div>
      
    </div>
    <footer>
        <h1>Footer</h1>
    </footer>
  </body>
</html>
