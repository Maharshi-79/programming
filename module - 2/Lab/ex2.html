<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div class="main">
        <h1>Registration form</form></h1>
        <form action="" method="post" >

	
	<label for="name">Full Name:</label>
    <input type="text" id="name"  required><br><br>
	
	<label for="email">Enter your email:</label>
    <input type="email" id="email" placeholder="example@gmail" required><br><br>

	<label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" pattern="[1-9][0-9]{9}" maxlength="10"><br><br>
	
     <label for="subject">Choose a subject:</label>
       <select id="subject">
        <option value="Maths">Maths</option>
        <option value="Science">Science</option>
        <option value="Gujarati">Gujarati</option>
        <option value="Social Science">Social Science</option>
        <option value="Sanskrit">Sanskrit</option>
        <option value="English">English</option>
    </select><br><br>
    
    <label for="Message">Message:</label><br>
    <textarea id="Message"  rows="4" cols="35"></textarea><br><br>
	
	
    <button type="submit">Submit</button>
    </form>

	
    </div>
</body>
</html>
