<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Customer System</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>Customer Complaint Form</h2>

    <form id="customerForm">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" id="name" class="form-control">
            <small class="text-danger" id="nameError"></small>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" id="phone" class="form-control">
            <small class="text-danger" id="phoneError"></small>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="text" id="email" class="form-control">
            <small class="text-danger" id="emailError"></small>
        </div>

        <div class="mb-3">
            <label>Vehicle</label>
            <input type="text" id="vehicle" class="form-control">
        </div>

        <div class="mb-3">
            <label>Complaint</label>
            <textarea id="complaint" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

        <p class="text-success mt-2" id="successMsg"></p>

    </form>
</div>

<script src="script.js"></script>
</body>
</html>
